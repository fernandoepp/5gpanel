# Esquema de validació dels .env. El panell NOMÉS deixa escriure les claus que
# surten aquí (i l'agent, a més, només les que té a "editable_keys").
# Tipus: int, float, str, ipv4. Restriccions: enum, min, max, regex.

radio:
  titol: "Ràdio (gNB ocudu + USRP B210)"
  dispositiu:
    model: B210
    # Taxes de mostreig (MHz) acceptades per ocudu amb la B210
    srate_permeses: [5.76, 7.68, 11.52, 15.36, 23.04, 30.72, 46.08]
    srate_max_siso: 46.08
    srate_max_mimo: 23.04          # 2x2: el bus USB 3 de la B210 no dona per més
    ample_max_mimo: 20
    # srate mínima = ample de banda * factor (20 MHz -> 23.04, 40 MHz -> 46.08)
    factor_srate_ample: 1.152
    freq_min_mhz: 70
    freq_max_mhz: 6000
  # Bandes FR1 (3GPP TS 38.104, taula 5.2-1): rang de BAIXADA en MHz, SCS permeses i pas
  # del raster de canal en ARFCN (100 kHz -> 20; 15 kHz -> 1 amb SCS 15 i 2 amb SCS 30).
  # El panell calcula DL_ARFCN, BAND i SCS a partir de la freqüència central.
  bandes:
    1:  {duplex: FDD, dl_mhz: [2110, 2170], scs: [15, 30], pas: 20}
    2:  {duplex: FDD, dl_mhz: [1930, 1990], scs: [15, 30], pas: 20}
    3:  {duplex: FDD, dl_mhz: [1805, 1880], scs: [15, 30], pas: 20}
    5:  {duplex: FDD, dl_mhz: [869, 894],   scs: [15, 30], pas: 20}
    7:  {duplex: FDD, dl_mhz: [2620, 2690], scs: [15, 30], pas: 20}
    8:  {duplex: FDD, dl_mhz: [925, 960],   scs: [15, 30], pas: 20}
    20: {duplex: FDD, dl_mhz: [791, 821],   scs: [15, 30], pas: 20}
    25: {duplex: FDD, dl_mhz: [1930, 1995], scs: [15, 30], pas: 20}
    28: {duplex: FDD, dl_mhz: [758, 803],   scs: [15, 30], pas: 20}
    38: {duplex: TDD, dl_mhz: [2570, 2620], scs: [15, 30], pas: 20}
    40: {duplex: TDD, dl_mhz: [2300, 2400], scs: [15, 30], pas: 20}
    41: {duplex: TDD, dl_mhz: [2496, 2690], scs: [15, 30], pas: {15: 3, 30: 6}, ample_min: 10}
    48: {duplex: TDD, dl_mhz: [3550, 3700], scs: [15, 30], pas: {15: 1, 30: 2}}
    65: {duplex: FDD, dl_mhz: [2110, 2200], scs: [15, 30], pas: 20}
    66: {duplex: FDD, dl_mhz: [2110, 2200], scs: [15, 30], pas: 20}
    71: {duplex: FDD, dl_mhz: [617, 652],   scs: [15, 30], pas: 20}
    77: {duplex: TDD, dl_mhz: [3300, 4200], scs: [15, 30], pas: {15: 1, 30: 2}, ample_min: 10}
    78: {duplex: TDD, dl_mhz: [3300, 3800], scs: [15, 30], pas: {15: 1, 30: 2}, ample_min: 10}
    79: {duplex: TDD, dl_mhz: [4400, 5000], scs: [30],     pas: {30: 2},        ample_min: 40}
  # Quan una freqüència cau en bandes solapades, es proposa la primera d'aquesta llista
  # (sempre es pot canviar a mà entre les que la contenen).
  prioritat: [78, 77, 1, 3, 7, 38, 41, 40, 28, 20, 8, 79, 48, 65, 66, 2, 25, 5, 71]
  camps:
    CORE_IP:       {tipus: ipv4, etiqueta: "IP del core (AMF)"}
    RADIO_IP:      {tipus: ipv4, etiqueta: "IP del gNB"}
    DL_ARFCN:      {tipus: int, min: 0, max: 3279165, etiqueta: "ARFCN de baixada"}
    BAND:          {tipus: int, enum: [1, 2, 3, 5, 7, 8, 20, 25, 28, 38, 40, 41, 48, 65, 66, 71, 77, 78, 79], etiqueta: "Banda NR"}
    BANDWIDTH_MHZ: {tipus: int, enum: [5, 10, 15, 20, 25, 30, 40], etiqueta: "Ample de banda (MHz)"}
    SCS:           {tipus: int, enum: [15, 30], etiqueta: "Espaiat de subportadora (kHz)"}
    SRATE:         {tipus: float, enum: [5.76, 7.68, 11.52, 15.36, 23.04, 30.72, 46.08], etiqueta: "Taxa de mostreig (MHz)"}
    TX_GAIN:       {tipus: int, min: 0, max: 89, etiqueta: "Guany TX (dB)"}
    RX_GAIN:       {tipus: int, min: 0, max: 76, etiqueta: "Guany RX (dB)"}
    PCI:           {tipus: int, min: 0, max: 1007, etiqueta: "Identificador físic de cel·la (PCI)"}
    # Ull: al docker-compose.yml d'ocudu, nof_antennas_dl = ${RX_ANTENA} i
    # nof_antennas_ul = ${TX_ANTENA}. Les etiquetes diuen el que fa realment.
    RX_ANTENA:     {tipus: int, enum: [1, 2], etiqueta: "Antenes de baixada (DL)"}
    TX_ANTENA:     {tipus: int, enum: [1, 2], etiqueta: "Antenes de pujada (UL)"}
    PLMN_1:        {tipus: str, regex: "^[0-9]{5,6}$", etiqueta: "PLMN (MCC + MNC)"}
    TAC:           {tipus: int, min: 0, max: 16777215, etiqueta: "Codi d'àrea (TAC)"}

core:
  titol: "Core 5G (Open5GS)"
  camps:
    MCC:              {tipus: str, regex: "^[0-9]{3}$", etiqueta: "Codi de país (MCC)"}
    MNC:              {tipus: str, regex: "^[0-9]{2,3}$", etiqueta: "Codi de xarxa (MNC)"}
    DOCKER_HOST_IP:   {tipus: ipv4, etiqueta: "IP del core (host)"}
    UPF_ADVERTISE_IP: {tipus: ipv4, etiqueta: "IP anunciada per l'UPF (N3)"}
